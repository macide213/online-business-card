<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Derek Bartoli | Digital Business Card</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="drenched">
    <main class="card-container">
        <div class="contact-card">
            <div class="card-header">
                <div class="logo-container">
                    <img src="assets/branding/logos/logo-main.svg" alt="DB Logo" class="brand-logo">
                </div>
            </div>
            
            <div class="card-body">
                <div class="profile-section">
                    <h1 id="name">Derek Bartoli</h1>
                    <p id="tagline" class="title">Freelance Developer</p>
                </div>
                
                <div class="contact-methods">
                    <a href="tel:+14075698409" class="contact-btn call">
                        <i class="fa-solid fa-phone"></i>
                        <span>Call Me</span>
                        <small>(407) 569-8409</small>
                    </a>
                    <a href="https://wa.me/14077445181" class="contact-btn whatsapp" target="_blank">
                        <i class="fa-brands fa-whatsapp"></i>
                        <span>WhatsApp</span>
                    </a>
                    <a href="mailto:derek@bartoli.me" class="contact-btn email">
                        <i class="fa-solid fa-envelope"></i>
                        <span>Email Me</span>
                    </a>
                    <a href="vcard.vcf" class="contact-btn vcard" download>
                        <i class="fa-solid fa-address-card"></i>
                        <span>Save Info</span>
                    </a>
                </div>

                <div class="info-list">
                    <div class="info-item">
                        <i class="fa-solid fa-envelope"></i>
                        <a href="mailto:derek@bartoli.me">derek@bartoli.me</a>
                    </div>
                    <div class="info-item">
                        <i class="fa-solid fa-globe"></i>
                        <a href="https://derek.bartoli.me" target="_blank">derek.bartoli.me</a>
                    </div>
                </div>

                <div class="social-links">
                    <a href="https://linkedin.com/in/derek-bartoli" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                    <a href="https://github.com/macide213" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="https://x.com/DerekBartoli" target="_blank" title="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
                </div>
            </div>

            <div class="card-footer">
                <div class="qr-section">
                    <p>Scan to add contact</p>
                    <div class="qr-code">
                        <img src="qrcode.png" alt="Scan to add contact">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Basic logic to update dynamic fields from vCard if needed, though script updates the file -->
    <script src="script.js"></script>
</body>
</html>
